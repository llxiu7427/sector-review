const WL_KEY = 'purple_watchlist';
function wlGet(){ try { return JSON.parse(localStorage.getItem(WL_KEY) || '[]'); } catch(e) { return []; } }
function wlSave(wl){ localStorage.setItem(WL_KEY, JSON.stringify(wl)); }
function wlHas(type, id){ return wlGet().some(x => x.type === type && x.id === id); }
function wlAdd(type, id, name, btn){
  const wl = wlGet();
  if (!wl.some(x => x.type === type && x.id === id)) {
    wl.push({type, id, name, added: TODAY}); wlSave(wl);
  }
  if (btn) { btn.textContent = '已加入'; btn.disabled = true; }
}
function wlDel(type, id){ wlSave(wlGet().filter(x => !(x.type === type && x.id === id))); renderWl(); }
function fmtPct(v){ if (v === null || v === undefined) return '—';
  return '<span style="color:' + (v > 0 ? '#c0392b' : (v < 0 ? '#1e8449' : '#666')) + '">' + (v > 0 ? '+' : '') + v + '%</span>'; }
function fmtNet(v){ if (v === null || v === undefined) return '—';
  return '<span style="color:' + (v > 0 ? '#c0392b' : (v < 0 ? '#1e8449' : '#666')) + '">' + (v > 0 ? '+' : '') + v + '</span>'; }
let bdRows = [];
function openBoard(code){
  const b = BDS[code]; if (!b) return;
  document.getElementById('bdTitle').textContent = b[0];
  document.getElementById('bdSub').innerHTML =
    '信号 ' + (b[4] || '—') + ' ｜ 涨跌幅 ' + b[1] + '% ｜ 净流入 ' + b[3] + ' 亿';
  const wbtn = document.getElementById('bdWl');
  if (wlHas('board', code)) { wbtn.textContent = '已加入'; wbtn.disabled = true; }
  else { wbtn.textContent = '＋加入观察'; wbtn.disabled = false;
         wbtn.onclick = () => wlAdd('board', code, b[0], wbtn); }
  bdRows = (MEM[code] || []).map(c => { const s = STK[c]; return s ? [c, ...s] : null; })
                           .filter(Boolean);
  bdRows.sort((a, z) => z[2] - a[2]);
  renderBd();
  toggleSheet('sheet-board');
}
function renderBd(){
  document.getElementById('bdBody').innerHTML = bdRows.map(r =>
    '<tr><td><b>' + r[1] + '</b> <span style="color:#8e8e93;font-size:11px">' + r[0] + '</span></td>'
    + '<td>' + fmtPct(r[2]) + '</td><td>' + (r[3] === null ? '—' : r[3].toFixed(2)) + '</td>'
    + '<td>' + r[4].toFixed(1) + '</td><td>' + fmtNet(r[5]) + '</td>'
    + '<td><button class="wlbtn" onclick="wlAdd(\'stock\',\'' + r[0] + '\',\'' + r[1] + '\',this)">＋</button></td></tr>'
  ).join('');
}
function sortBd(i){
  bdRows.sort((a, z) => (typeof a[i] === 'number' && typeof z[i] === 'number') ? z[i] - a[i] : 0);
  renderBd();
}
let wlSortK = 2, wlSortAsc = false;
function renderWl(){
  const wl = wlGet();
  const area = document.getElementById('wlArea');
  if (!wl.length) {
    area.innerHTML = '<div class="panel" style="padding:30px;text-align:center;color:#8e8e93">'
      + '观察列表是空的。到「市场复盘」点板块名展开成分股，板块和个股都可以加入观察。</div>';
    return;
  }
  const rows = wl.map(w => {
    if (w.type === 'board') { const b = BDS[w.id]; if (!b) return null;
      return {name: w.name, type: '板块', pct: b[1], turn: b[2], net: b[3], sig: b[4],
              status: boardStatus(w.name, b[4]), added: w.added, id: w.id, tp: w.type}; }
    const s = STK[w.id]; if (!s) return null;
    return {name: w.name, type: '个股', pct: s[1], turn: s[2], net: s[4], sig: '—',
            status: s[1] >= 5 ? '强势' : (s[1] <= -5 ? '弱势' : '—'),
            added: w.added, id: w.id, tp: w.type};
  }).filter(Boolean);
  rows.sort((a, z) => {
    const va = a[wlSortK], vz = z[wlSortK];
    if (typeof va === 'number' && typeof vz === 'number') return wlSortAsc ? va - vz : vz - va;
    return wlSortAsc ? String(va).localeCompare(String(vz), 'zh') : String(vz).localeCompare(String(va), 'zh');
  });
  const head = [['name','名称'],['type','类型'],['pct','涨跌幅'],['turn','换手%'],['net','净流入(亿)'],['sig','信号'],['status','今日状态'],['added','加入日期']];
  const statusColor = s => s.startsWith('延续') ? '#c0392b' : (s.startsWith('断板') || s === '弱势' ? '#1e8449' : (s === '强势' ? '#c0392b' : '#8e8e93'));
  document.getElementById('wlArea').innerHTML = '<div class="tw"><table><thead><tr>'
    + head.map(h => '<th class="sortable" onclick="wlSort(\'' + h[0] + '\')">' + h[1] + '</th>').join('')
    + '<th>操作</th></tr></thead><tbody>'
    + rows.map(r => '<tr><td><b>' + r.name + '</b></td><td>' + r.type + '</td>'
      + '<td>' + fmtPct(r.pct) + '</td>'
      + '<td>' + (r.turn === null ? '—' : r.turn.toFixed(2)) + '</td>'
      + '<td>' + fmtNet(r.net) + '</td><td>' + r.sig + '</td>'
      + '<td><span style="color:' + statusColor(r.status) + '">' + r.status + '</span></td>'
      + '<td>' + r.added + '</td>'
      + '<td><button class="wlbtn" onclick="wlDel(\'' + r.tp + '\',\'' + r.id + '\')">移除</button></td></tr>').join('')
    + '</tbody></table></div>';
}
